  <style>
    :root {
    /* design-epoch: '536' */
      --font-pixel: "Silkscreen", "Courier New", ui-monospace, monospace;
      --glass-top: rgba(255, 255, 255, 0.22);
      --glass-fill: rgba(10, 16, 30, 0.40);
      --glass-rim: rgba(255, 255, 255, 0.38);
      --glow: rgba(255, 255, 255, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #3fa9f5;
      color: #fff;
      font-family: var(--font-pixel);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Pixel art, rendered pixelated rather than smoothed, filling the frame. */
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Sky effects: clouds and petals drifting behind the card, purely
       decorative, never blocking the click target. */
    .fx {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
      transform: translate(calc(var(--par-x, 0) * 1px), calc(var(--par-y, 0) * 1px));
      transition: transform 0.35s ease-out;
    }
    .cloud {
      position: absolute;
      background: #fffaf5;
      clip-path: polygon(0 64%, 8% 64%, 8% 48%, 18% 48%, 18% 35%, 29% 35%, 29% 22%, 43% 22%, 43% 12%, 58% 12%, 58% 24%, 70% 24%, 70% 37%, 82% 37%, 82% 50%, 92% 50%, 92% 64%, 100% 64%, 100% 78%, 85% 78%, 85% 87%, 17% 87%, 17% 78%, 0 78%);
      filter: drop-shadow(0 8px 0 #b6dff2);
    }
    .cloud::after { content: ""; position: absolute; inset: 53% 20% 10%; background: #e4f6fc; clip-path: polygon(0 0, 100% 0, 100% 35%, 85% 35%, 85% 65%, 15% 65%, 15% 35%, 0 35%); }
    .cloud-a { top: 8%; left: -300px; width: 240px; height: 96px; opacity: 0.9; animation: photogit-drift 52s linear infinite; }
    @keyframes photogit-drift {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 460px)); }
    }
    .cloud-b { top: 18%; left: -180px; width: 172px; height: 72px; opacity: 0.75; animation: photogit-drift 64s linear infinite; animation-delay: -20s; }
    .cloud-c { top: 2%; left: -330px; width: 270px; height: 112px; opacity: 0.8; animation: photogit-drift 80s linear infinite; animation-delay: -50s; }
    .cloud-d { top: 14%; left: -210px; width: 160px; height: 56px; opacity: 0.7; animation: photogit-drift 72s linear infinite reverse; animation-delay: -8s; }
    .cloud-e { top: 27%; left: -240px; width: 205px; height: 78px; opacity: 0.7; animation: photogit-drift 68s linear infinite; animation-delay: -39s; }
    /* Petals echo the cherry blossoms already in the artwork. */
    .petal {
      position: absolute;
      top: -5%;
      width: var(--size);
      height: calc(var(--size) * 1.5);
      background: linear-gradient(135deg, #fff0f6 10%, #f8a9cb 80%);
      clip-path: polygon(50% 0%, 85% 25%, 100% 50%, 85% 75%, 50% 100%, 15% 75%, 0% 50%, 15% 25%);
      image-rendering: pixelated;
      opacity: var(--alpha);
      animation: photogit-fall var(--duration) var(--delay) linear infinite;
      box-shadow: 1px 2px 0px rgba(255, 199, 225, 0.35);
    }
    .petal:nth-of-type(4n) { background: #ffe8f1; }
    .petal:nth-of-type(7n) { background: #f68fbb; }
    .blossom {
      position: absolute;
      width: 28px; height: 28px;
      background: #fff0f6;
      clip-path: polygon(40% 0, 60% 0, 70% 28%, 92% 18%, 100% 38%, 76% 53%, 90% 76%, 72% 90%, 54% 70%, 34% 100%, 16% 86%, 29% 59%, 0 49%, 7% 28%, 34% 34%);
      filter: drop-shadow(2px 3px 0 #d96a9b);
      opacity: .9;
      animation: blossom-bob 5s ease-in-out infinite alternate;
    }
    .blossom::after { content: ""; position: absolute; left: 42%; top: 42%; width: 16%; height: 16%; background: #f3ae49; }
    @keyframes blossom-bob { to { transform: translateY(-8px) rotate(12deg); } }
    @keyframes photogit-fall {
      0%   { transform: translate(0, -10vh) rotate(0deg); }
      50%  { transform: translate(var(--sway), 55vh) rotate(160deg) rotateY(150deg); }
      100% { transform: translate(-20px, 120vh) rotate(340deg) rotateY(300deg); }
    }
    /* A soft vignette settles the eye on the centred card rather than
       the frame edges. */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(3, 10, 24, 0.5) 100%);
      pointer-events: none;
    }
    .glare {
      position: absolute;
      top: -10%; right: -8%;
      width: 40vmax; height: 40vmax;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
      animation: photogit-glare-pulse 7s ease-in-out infinite;
    }
    @keyframes photogit-glare-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 0 2px, transparent 2px 4px);
      mix-blend-mode: overlay;
      opacity: 0.4;
      animation: photogit-scan 5s linear infinite;
    }
    @keyframes photogit-scan {
      from { background-position: 0 0; }
      to { background-position: 0 8px; }
    }
    /* Explicit stacking, so a future addition to any one layer cannot
       accidentally end up drawn over the card or its click target. */
    .hero { z-index: 0; }
    .vignette { z-index: 1; }
    .fx { z-index: 2; }
    .landing { position: relative; min-height: 100svh; display: grid; place-items: center; isolation: isolate; overflow: hidden; }
    .content { position: relative; z-index: 3; padding: 80px 20px; text-align: center; }
    .title {
      margin: 0 0 36px; font-size: clamp(62px, 12vw, 150px); line-height: 1.15;
      letter-spacing: -0.08em; font-weight: 700; color: #fff;
      text-shadow: 4px 0 #fff, -4px 0 #fff, 0 4px #fff, 0 -4px #fff, 8px 8px #b5eaff, -8px 8px #b5eaff, 0 14px #77c9ef, 0 22px 0 #27618e, 0 30px 0 #163d64, 0 38px 20px #12436dcc;
      animation: arrive 900ms ease-out both, title-float 7s 900ms ease-in-out infinite;
    }
    .actions { display: flex; align-items: stretch; justify-content: center; animation: arrive 900ms 180ms ease-out both; }
    .try-container {
      display: flex; align-items: center; width: min(460px, calc(100vw - 48px));
      border: 3px solid #f5fbff; border-radius: 999px;
      background: linear-gradient(145deg, #d7f5ff, #8cceef 65%, #6bb7e2);
      box-shadow: inset 0 5px 0 #ffffff8c, inset 0 -8px 0 #4397ca55, 0 12px 0 #286b97, 0 22px 30px #0c385b77;
    }
    .actions a { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 102px; padding: 20px 64px; border-radius: 999px; color: #fff; text-decoration: none; font-family: Arial, Helvetica, sans-serif; font-size: clamp(25px, 3vw, 34px); font-weight: 700; text-shadow: 0 3px 0 #498caf; transition: background 180ms, transform 180ms; }
    .actions a:hover { background: #ffffff30; transform: translateY(-3px); }
    .actions a:focus-visible { outline: 3px solid #ffcbdf; outline-offset: 3px; }
    .actions a span { position: absolute; right: 36px; font-size: 38px; line-height: 1; transition: transform 180ms; }
    .actions a:hover span { transform: translate(3px, -2px); }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes title-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .site-footer {
      position: absolute;
      inset: auto 0 0;
      z-index: 4;
      min-height: 76px;
      padding: 8px max(24px, calc((100vw - 1560px) / 2)) max(8px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 3px solid #75452e;
      background: #2b1b28;
      box-shadow: inset 0 12px 0 #422633;
    }
    .footer-credit { color: #f7d78c; font-size: 15px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .icon-bar { display: flex; align-items: center; gap: 14px; }
    .icon-bar a {
      width: 52px;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #c58b4d;
      border-radius: 0;
      background: #14151a;
      color: #fff;
      text-decoration: none;
      box-shadow: inset 0 0 0 3px #38292b;
      transition: transform 180ms, border-color 180ms;
    }
    .icon-bar svg { width: 31px; height: 31px; fill: currentColor; }
    .icon-bar a:hover { transform: translateY(-3px); border-color: #f0ba73; }
    .icon-bar a:focus-visible { outline: 3px solid #ffcbdf; outline-offset: 3px; }
    @media (max-width: 560px) {
      .actions { flex-direction: column; align-items: center; gap: 14px; }
      .title { margin-bottom: 28px; }
      .try-container { width: min(380px, calc(100vw - 48px)); justify-content: center; }
      .actions a { min-height: 78px; }
      .actions a span { right: 24px; }
      .petal:nth-of-type(n+22) { display: none; }
      .site-footer { padding-inline: 16px; gap: 12px; }
      .footer-credit { font-size: 10px; }
      .icon-bar { gap: 7px; }
      .icon-bar a { width: 38px; height: 38px; border-width: 3px; }
      .icon-bar svg { width: 24px; height: 24px; }
    }
    @media (max-height: 420px) { .content { padding: 20px; } .title { margin-bottom: 18px; font-size: 40px; } .actions { flex-direction: row; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .fx { transform: none; }
      .petal { top: calc(var(--size) * 5); }
    }
  </style>

  <script>
    (function () {
      var reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      var finePointer = matchMedia('(hover: hover) and (pointer: fine)');
      var fx = document.querySelector('.fx');
      var frame = 0;
      var pointerX = 0;
      var pointerY = 0;

      function resetParallax() {
        cancelAnimationFrame(frame);
        frame = 0;
        fx.style.removeProperty('--par-x');
        fx.style.removeProperty('--par-y');
      }
      function syncMotion() {
        if (reducedMotion.matches || document.hidden || !finePointer.matches) resetParallax();
      }
      reducedMotion.addEventListener('change', syncMotion);
      finePointer.addEventListener('change', syncMotion);
      document.addEventListener('visibilitychange', syncMotion);
      document.documentElement.addEventListener('pointerleave', resetParallax);
      window.addEventListener('blur', resetParallax);
      window.addEventListener('pointermove', function (event) {
        if (reducedMotion.matches || document.hidden || !finePointer.matches) return;
        pointerX = (event.clientX / window.innerWidth - 0.5) * -28;
        pointerY = (event.clientY / window.innerHeight - 0.5) * -20;
        if (frame) return;
        frame = requestAnimationFrame(function () {
          fx.style.setProperty('--par-x', String(pointerX));
          fx.style.setProperty('--par-y', String(pointerY));
          frame = 0;
        });
      }, { passive: true });
      syncMotion();
    })();
  </script>
