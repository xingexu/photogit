<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PhotoGit — Version control for Photoshop</title>
  <meta name="description" content="PhotoGit — version control for Photoshop. Try it on GitHub.">
  <meta name="theme-color" content="#3fa9f5">
  <link rel="preload" as="image" href="artwork/japanties.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
  <style>
    :root {
      --font-pixel: "Silkscreen", "Courier New", ui-monospace, monospace;
      --glass-top: rgba(255, 255, 255, 0.22);
      --glass-fill: rgba(10, 16, 30, 0.40);
      --glass-rim: rgba(255, 255, 255, 0.38);
      --glow: rgba(255, 255, 255, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #3fa9f5;
      color: #fff;
      font-family: var(--font-pixel);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Pixel art, rendered pixelated rather than smoothed, filling the frame. */
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Sky effects: clouds and petals drifting behind the card, purely
       decorative, never blocking the click target. */
    .fx {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
      transform: translate(calc(var(--par-x, 0) * 1px), calc(var(--par-y, 0) * 1px));
      transition: transform 0.35s ease-out;
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      clip-path: polygon(10% 60%, 10% 40%, 20% 40%, 20% 20%, 40% 20%, 40% 10%, 60% 10%, 60% 20%, 80% 20%, 80% 40%, 90% 40%, 90% 60%, 80% 60%, 80% 70%, 20% 70%, 20% 60%);
    }
    .cloud-a { top: 10%; left: -240px; width: 220px; height: 100px; opacity: 0.85; animation: photogit-drift 48s linear infinite; }
    @keyframes photogit-drift {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 460px)); }
    }
    .cloud-b { top: 22%; left: -160px; width: 150px; height: 68px; opacity: 0.55; animation: photogit-drift 64s linear infinite; animation-delay: -20s; }
    .cloud-c { top: 6%; left: -300px; width: 260px; height: 120px; opacity: 0.7; animation: photogit-drift 80s linear infinite; animation-delay: -50s; }
    /* Petals echo the cherry blossoms already in the artwork. */
    .petal {
      position: absolute;
      top: -5%;
      width: var(--size);
      height: calc(var(--size) * 1.4);
      background: linear-gradient(135deg, #ffd3e2, #f6a9c6);
      border-radius: 70% 0 70% 0;
      opacity: var(--alpha);
      animation: photogit-fall var(--duration) var(--delay) linear infinite;
    }
    @keyframes photogit-fall {
      0%   { transform: translate(0, -10vh) rotate(0deg); }
      50%  { transform: translate(var(--sway), 55vh) rotate(160deg) rotateY(150deg); }
      100% { transform: translate(-20px, 120vh) rotate(340deg) rotateY(300deg); }
    }
    /* A soft vignette settles the eye on the centred card rather than
       the frame edges. */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(3, 10, 24, 0.5) 100%);
      pointer-events: none;
    }
    .glare {
      position: absolute;
      top: -10%; right: -8%;
      width: 40vmax; height: 40vmax;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
      animation: photogit-glare-pulse 7s ease-in-out infinite;
    }
    @keyframes photogit-glare-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 0 2px, transparent 2px 4px);
      mix-blend-mode: overlay;
      opacity: 0.4;
      animation: photogit-scan 5s linear infinite;
    }
    @keyframes photogit-scan {
      from { background-position: 0 0; }
      to { background-position: 0 8px; }
    }
    /* Explicit stacking, so a future addition to any one layer cannot
       accidentally end up drawn over the card or its click target. */
    .hero { z-index: 0; }
    .vignette { z-index: 1; }
    .fx { z-index: 2; }
    .landing { position: relative; min-height: 100svh; display: grid; place-items: center; isolation: isolate; overflow: hidden; }
    .content { position: relative; z-index: 3; padding: 80px 20px; text-align: center; }
    .title {
      margin: 0 0 38px; font-size: clamp(40px, 9vw, 100px); line-height: 1.15;
      letter-spacing: -0.065em; font-weight: 700;
      text-shadow: 0 3px 0 #243345, 0 6px 22px #10283c80;
      animation: arrive 900ms ease-out both, title-float 7s 900ms ease-in-out infinite;
    }
    .actions { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 18px; animation: arrive 900ms 180ms ease-out both; }
    .social-container, .try-container {
      display: flex; align-items: center; padding: 8px;
      border: 1px solid #ffffff80; border-radius: 20px;
      background: linear-gradient(150deg, #ffffff30, #ffffff08), #102438b8;
      box-shadow: inset 0 1px 0 #ffffff40, 0 12px 30px #091b3638;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .actions a { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 48px; padding: 12px 16px; border-radius: 12px; color: white; text-decoration: none; font-size: 14px; transition: background 180ms, transform 180ms; }
    .social-container a + a { border-left: 1px solid #ffffff30; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .actions a:hover { background: #ffffff20; transform: translateY(-2px); }
    .actions a:focus-visible { outline: 3px solid #ffcbdf; outline-offset: 3px; }
    .actions a span { transition: transform 180ms; }
    .actions a:hover span { transform: translate(3px, -2px); }
    .try-container { background: linear-gradient(145deg, #ffe0ed, #f4b6d0); border-color: #fff0f6; }
    .try-container a { color: #432039; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes title-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .motion-toggle {
      position: absolute; right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom)); z-index: 4;
      min-height: 44px; padding: 10px 14px; border: 1px solid #ffffff80;
      border-radius: 12px; background: #102438e6; color: #fff;
      font: 14px var(--font-pixel); cursor: pointer;
    }
    .motion-toggle[hidden] { display: none; }
    .motion-toggle:focus-visible { outline: 3px solid #ffcbdf; outline-offset: 3px; }
    .motion-paused *, .motion-paused *::before, .motion-paused *::after { animation-play-state: paused !important; }
    .motion-paused .fx { transform: none; transition: none; }
    @media (max-width: 560px) {
      .actions { flex-direction: column; align-items: center; gap: 14px; }
      .title { margin-bottom: 28px; }
      .try-container { min-width: 180px; justify-content: center; }
      .petal:nth-of-type(n+28) { display: none; }
    }
    @media (max-height: 420px) { .content { padding: 20px; } .title { margin-bottom: 18px; font-size: 40px; } .actions { flex-direction: row; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .fx { transform: none; }
      .petal { top: calc(var(--size) * 5); }
      .motion-toggle { display: none; }
    }
  </style>

  <script>
    (function () {
      var reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      var finePointer = matchMedia('(hover: hover) and (pointer: fine)');
      var fx = document.querySelector('.fx');
      var toggle = document.querySelector('.motion-toggle');
      var paused = false;
      var frame = 0;
      var pointerX = 0;
      var pointerY = 0;

      function resetParallax() {
        cancelAnimationFrame(frame);
        frame = 0;
        fx.style.removeProperty('--par-x');
        fx.style.removeProperty('--par-y');
      }
      function syncMotion() {
        var stopped = paused || reducedMotion.matches || document.hidden;
        document.documentElement.classList.toggle('motion-paused', stopped);
        toggle.hidden = reducedMotion.matches;
        toggle.setAttribute('aria-pressed', String(paused));
        toggle.textContent = paused ? 'Resume animation' : 'Pause animation';
        if (stopped || !finePointer.matches) resetParallax();
      }
      toggle.addEventListener('click', function () {
        paused = !paused;
        syncMotion();
      });
      reducedMotion.addEventListener('change', syncMotion);
      finePointer.addEventListener('change', syncMotion);
      document.addEventListener('visibilitychange', syncMotion);
      document.documentElement.addEventListener('pointerleave', resetParallax);
      window.addEventListener('blur', resetParallax);
      window.addEventListener('pointermove', function (event) {
        if (paused || reducedMotion.matches || document.hidden || !finePointer.matches) return;
        pointerX = (event.clientX / window.innerWidth - 0.5) * -28;
        pointerY = (event.clientY / window.innerHeight - 0.5) * -20;
        if (frame) return;
        frame = requestAnimationFrame(function () {
          fx.style.setProperty('--par-x', String(pointerX));
          fx.style.setProperty('--par-y', String(pointerY));
          frame = 0;
        });
      }, { passive: true });
      syncMotion();
    })();
  </script>
