<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>photogit</title>
  <meta name="description" content="PhotoGit — version control for Photoshop. Try it on GitHub.">
  <meta name="theme-color" content="#3fa9f5">
  <link rel="preload" as="image" href="artwork/japanties.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
  <style>
    :root {
      --font-pixel: "Silkscreen", "Courier New", ui-monospace, monospace;
      --glass-top: rgba(255, 255, 255, 0.22);
      --glass-fill: rgba(10, 16, 30, 0.40);
      --glass-rim: rgba(255, 255, 255, 0.38);
      --glow: rgba(255, 255, 255, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #3fa9f5;
      color: #fff;
      font-family: var(--font-pixel);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* The whole page is one link: a landing page whose job is to send a
       visitor on to the project's setup instructions. */
    .page-link {
      position: fixed;
      inset: 0;
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .page-link:focus-visible .glass-card { outline: 3px solid #fff; outline-offset: 4px; }

    /* Pixel art, rendered pixelated rather than smoothed, filling the frame. */
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Liquid glass · a dark, translucent card floats dead-centre over the
       artwork — a bright inset top edge, a hairline rim and a soft glow,
       the same recipe the PhotoGit panel itself uses for its cards. Blur is
       layered on only where the host supports it; without it, the fill
       alone still reads as a distinct panel over the photo. */
    .glass-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: clamp(28px, 5vw, 48px) clamp(32px, 7vw, 72px);
      border-radius: 28px;
      border: 1px solid var(--glass-rim);
      background:
        linear-gradient(180deg, var(--glass-top), rgba(255, 255, 255, 0) 55%),
        var(--glass-fill);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.35) inset,
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 0 70px -10px var(--glow),
        0 28px 60px -24px rgba(3, 8, 20, 0.6);
      overflow: hidden;
      animation: photogit-enter 0.8s ease-out both, photogit-float 6s ease-in-out infinite;
    }
    @supports (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px)) {
      .glass-card { backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); }
    }
    @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
      .glass-card { --glass-fill: rgba(8, 13, 26, 0.72); }
    }
    /* A soft band of light drifts across the glass, the liquid part of
       "liquid glass". Purely decorative: it sits behind the text and
       never affects layout or the click target. */
    .glass-card::before {
      content: "";
      position: absolute;
      inset: -40% -20%;
      background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.4) 48%, transparent 66%);
      background-size: 220% 220%;
      animation: photogit-sheen 8s linear infinite;
      pointer-events: none;
    }

    /* Pixel-art wordmark: the same blocky pixel typeface the scene itself
       is drawn in, in white with a soft misty glow rather than the flat
       black of a plain wordmark. */
    .wordmark {
      position: relative;
      display: block;
      overflow: hidden;
      margin: 0;
      font-family: var(--font-pixel);
      font-weight: 700;
      font-size: clamp(32px, 7vw, 64px);
      letter-spacing: 0.04em;
      line-height: 1;
      color: #fff;
      text-shadow:
        -2px -2px 0 #0b1220, 2px -2px 0 #0b1220, -2px 2px 0 #0b1220, 2px 2px 0 #0b1220,
        0 0 10px rgba(255, 255, 255, 0.75), 0 0 26px rgba(255, 255, 255, 0.4), 0 0 48px rgba(255, 255, 255, 0.22);
      animation: photogit-enter 0.6s ease-out 0.15s both;
    }

    /* The call to action reads as a small chip inside the same glass, so
       it is legible as the one thing to do here. */
    .cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 8px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.14);
      font-family: var(--font-pixel);
      font-weight: 400;
      font-size: clamp(13px, 2vw, 18px);
      letter-spacing: 0.03em;
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7), 0 0 20px rgba(255, 255, 255, 0.35);
      animation: photogit-enter 0.6s ease-out 0.4s both, photogit-pulse 3.2s ease-in-out 0.8s infinite;
    }
    .page-link:hover .cta, .page-link:focus-visible .cta { background: rgba(255, 255, 255, 0.24); }
    .cta::after {
      content: "";
      display: inline-block;
      width: 12px; height: 10px;
      margin-left: 10px;
      background: #fff;
      clip-path: polygon(0 15%, 55% 15%, 55% 0, 100% 50%, 55% 100%, 55% 85%, 0 85%);
      transition: transform 0.2s ease;
    }
    .page-link:hover .cta::after, .page-link:focus-visible .cta::after { transform: translateX(4px); }

    @keyframes photogit-float {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-10px); }
    }
    @keyframes photogit-sheen {
      from { background-position: 200% 0%; }
      to { background-position: -100% 0%; }
    }
    @keyframes photogit-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); }
      50% { box-shadow: 0 0 22px 4px rgba(255, 255, 255, 0.28); }
    }

    @media (max-height: 420px) {
      .glass-card { padding: 18px 28px; gap: 8px; }
      .cta { display: none; }
    }

    @media (max-width: 480px) {
      .cloud-c, .petal-d, .petal-e, .glare { display: none; }
      .cloud { opacity: 0.6; }
      .card-glow { width: 70vw; height: 40vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .glass-card, .glass-card::before, .glass-card::after, .card-glow,
      .cta, .cta::after, .wordmark, .shimmer,
      .cloud, .petal, .glare, .scanlines, .sparkle, .fx {
        animation: none !important;
        transition: none !important;
      }
      .glass-card { transform: translate(-50%, -50%) !important; }
      .glass-card::before, .shimmer, .scanlines { background-position: 0 0 !important; }
      .fx { transform: none !important; }
      .sparkle { opacity: 0.8 !important; transform: none !important; }
    }
    /* Sky effects: clouds and petals drifting behind the card, purely
       decorative, never blocking the click target. */
    .fx {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
      transform: translate(calc(var(--par-x, 0) * 1px), calc(var(--par-y, 0) * 1px));
      transition: transform 0.35s ease-out;
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      clip-path: polygon(10% 60%, 10% 40%, 20% 40%, 20% 20%, 40% 20%, 40% 10%, 60% 10%, 60% 20%, 80% 20%, 80% 40%, 90% 40%, 90% 60%, 80% 60%, 80% 70%, 20% 70%, 20% 60%);
    }
    .cloud-a { top: 10%; left: -240px; width: 220px; height: 100px; opacity: 0.85; animation: photogit-drift 48s linear infinite; }
    @keyframes photogit-drift {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 460px)); }
    }
    .cloud-b { top: 22%; left: -160px; width: 150px; height: 68px; opacity: 0.55; animation: photogit-drift 64s linear infinite; animation-delay: -20s; }
    .cloud-c { top: 6%; left: -300px; width: 260px; height: 120px; opacity: 0.7; animation: photogit-drift 80s linear infinite; animation-delay: -50s; }
    /* Petals echo the cherry blossoms already in the artwork. */
    .petal {
      position: absolute;
      top: -5%;
      width: 10px;
      height: 14px;
      background: linear-gradient(135deg, #ffd3e2, #f6a9c6);
      border-radius: 70% 0 70% 0;
      opacity: 0.85;
      animation: photogit-fall linear infinite;
    }
    @keyframes photogit-fall {
      0%   { transform: translate(0, -10vh) rotate(0deg); }
      50%  { transform: translate(30px, 55vh) rotate(160deg); }
      100% { transform: translate(-10px, 120vh) rotate(320deg); }
    }
    .petal-a { left: 18%; animation-duration: 11s; }
    .petal-b { left: 42%; width: 8px; height: 11px; opacity: 0.7; animation-duration: 14s; animation-delay: -3s; }
    .petal-c { left: 65%; animation-duration: 9.5s; animation-delay: -6s; }
    .petal-d { left: 82%; width: 7px; height: 10px; opacity: 0.6; animation-duration: 16s; animation-delay: -9s; }
    .petal-e { left: 6%; width: 9px; height: 13px; opacity: 0.75; animation-duration: 12.5s; animation-delay: -1s; }
    /* A soft vignette settles the eye on the centred card rather than
       the frame edges. */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(3, 10, 24, 0.35) 100%);
      pointer-events: none;
    }
    /* A light band sweeps over the wordmark's own box (not clipped to
       the glyphs themselves — background-clip: text combined with an
       animated gradient rendered solid black in testing, a real engine
       quirk, not just a style choice) and screens onto the letters
       beneath, which reads just as well as a moving highlight. */
    .shimmer {
      position: absolute;
      inset: -20% -30%;
      background: linear-gradient(100deg, transparent 40%, rgba(255, 255, 255, 0.8) 50%, transparent 60%);
      background-size: 250% 100%;
      mix-blend-mode: screen;
      animation: photogit-shimmer 3.6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes photogit-shimmer {
      0% { background-position: 200% 0; }
      60%, 100% { background-position: -60% 0; }
    }
    @keyframes photogit-enter {
      from { opacity: 0; filter: blur(6px); }
      to { opacity: 1; filter: blur(0); }
    }
    /* An ambient glow behind the card, as a sibling rather than a
       pseudo-element, so it can bleed past the card's own clipped edge. */
    .card-glow {
      position: absolute;
      top: 50%; left: 50%;
      width: min(560px, 80vw);
      height: min(280px, 50vw);
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--glow), rgba(255, 255, 255, 0) 70%);
      filter: blur(30px);
      opacity: 0.55;
      pointer-events: none;
      animation: photogit-glow-pulse 5s ease-in-out infinite;
    }
    @keyframes photogit-glow-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.75; }
    }
    .sparkle {
      position: absolute;
      width: 4px; height: 4px;
      background: #fff;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.9);
      border-radius: 1px;
      animation: photogit-twinkle 2.4s ease-in-out infinite;
    }
    .sparkle-a { top: -4px; left: 6%; animation-delay: -0.6s; }
    .sparkle-b { top: 55%; right: 4%; animation-delay: -1.5s; }
    @keyframes photogit-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .glare {
      position: absolute;
      top: -10%; right: -8%;
      width: 40vmax; height: 40vmax;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
      animation: photogit-glare-pulse 7s ease-in-out infinite;
    }
    @keyframes photogit-glare-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 0 2px, transparent 2px 4px);
      mix-blend-mode: overlay;
      opacity: 0.4;
      animation: photogit-scan 5s linear infinite;
    }
    @keyframes photogit-scan {
      from { background-position: 0 0; }
      to { background-position: 0 8px; }
    }
    /* Explicit stacking, so a future addition to any one layer cannot
       accidentally end up drawn over the card or its click target. */
    .hero { z-index: 0; }
    .vignette { z-index: 1; }
    .fx { z-index: 2; }
    .card-glow { z-index: 2; }
    .glass-card { z-index: 3; }
  </style>
</head>
<body>
  <a class="page-link" href="https://github.com/xingexu/photogit#quick-start" aria-label="photogit — try it on GitHub">
    <img class="hero"
         src="artwork/japanties.png"
         width="1586" height="992"
         alt="Pixel-art Japanese mountain village in cherry-blossom season: wooden houses with dark tiled roofs and pink blossoming trees line a stone path leading through a red torii gate to a five-storey pagoda, forested hills and a snow-capped peak behind, under an open blue sky."
         decoding="async" fetchpriority="high">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fx" aria-hidden="true">
      <span class="cloud cloud-a"></span>
      <span class="cloud cloud-b"></span>
      <span class="cloud cloud-c"></span>
      <span class="petal petal-a"></span>
      <span class="petal petal-b"></span>
      <span class="petal petal-c"></span>
      <span class="petal petal-d"></span>
      <span class="petal petal-e"></span>
      <span class="glare"></span>
      <span class="scanlines"></span>
      <!-- fx-end -->
    </div>
    <div class="card-glow" aria-hidden="true"></div>
    <div class="glass-card">
      <span class="wordmark">photogit<i class="shimmer" aria-hidden="true"></i></span>
      <span class="sparkle sparkle-a" aria-hidden="true"></span>
      <span class="sparkle sparkle-b" aria-hidden="true"></span>
      <span class="cta">try it!</span>
    </div>
  </a>
  <script>
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var fx = document.querySelector('.fx');
      if (!fx) return;
      window.addEventListener('pointermove', function (event) {
        var x = (event.clientX / window.innerWidth - 0.5) * 2;
        var y = (event.clientY / window.innerHeight - 0.5) * 2;
        fx.style.setProperty('--par-x', String(-x * 14));
        fx.style.setProperty('--par-y', String(-y * 10));
      }, { passive: true });
    })();
  </script>
</body>
</html>
