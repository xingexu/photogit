  <style>
    :root {
    /* design-epoch: '536' */
      --font-pixel: "Silkscreen", "Courier New", ui-monospace, monospace;
      --font-logo: "Press Start 2P", "Courier New", ui-monospace, monospace;
      --glass-top: rgba(255, 255, 255, 0.22);
      --glass-fill: rgba(10, 16, 30, 0.40);
      --glass-rim: rgba(255, 255, 255, 0.38);
      --glow: rgba(255, 255, 255, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #3fa9f5;
      color: #fff;
      font-family: var(--font-pixel);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .title, a { cursor: pointer; }
    .title, a, button { touch-action: manipulation; }

    /* Pixel art, rendered pixelated rather than smoothed, filling the frame. */
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Decorative petals stay behind the title and links. */
    .fx {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    }
    .page-hidden .fx *, .page-hidden .glare { animation-play-state: paused !important; }
    .sky-cloud {
      position: absolute;
      left: -720px;
      width: min(var(--cloud-width), 72vw);
      height: auto;
      opacity: var(--cloud-opacity);
      image-rendering: pixelated;
      animation: sky-drift var(--cloud-speed) linear infinite;
      animation-delay: var(--cloud-delay);
    }
    @keyframes sky-drift { to { transform: translateX(calc(100vw + 1440px)); } }
    .bird { position: absolute; left: -100px; top: var(--altitude); width: var(--bird-size); opacity: .8; animation: bird-flight var(--flight) var(--phase) linear infinite; }
    .bird svg { width: 100%; overflow: visible; shape-rendering: crispEdges; }
    .bird .wing { transform-origin: 12px 8px; animation: bird-flap var(--wing-speed, 800ms) steps(2, end) infinite alternate; animation-delay: var(--phase); }
    @keyframes bird-flight { to { transform: translateX(calc(100vw + 200px)); } }
    @keyframes bird-flap { to { transform: scaleY(-.65); } }
    .leaf-swarm { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    @media (prefers-reduced-motion: reduce) { .bird { left: var(--rest); } }
    /* Petals echo the cherry blossoms already in the artwork. */
    .petal {
      position: absolute;
      top: -5%;
      width: max(7px, calc(var(--size) * .6));
      height: max(7px, calc(var(--size) * .6));
      background-image: url('artwork/petals/petal-1.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      opacity: var(--alpha);
      animation: photogit-fall var(--duration) var(--delay) linear infinite;
    }
    .petal:nth-of-type(10n + 2) { background-image: url('artwork/petals/petal-2.png'); }
    .petal:nth-of-type(10n + 3) { background-image: url('artwork/petals/petal-3.png'); }
    .petal:nth-of-type(10n + 4) { background-image: url('artwork/petals/petal-4.png'); }
    .petal:nth-of-type(10n + 5) { background-image: url('artwork/petals/petal-5.png'); }
    .petal:nth-of-type(10n + 6) { background-image: url('artwork/petals/petal-6.png'); }
    .petal:nth-of-type(10n + 7) { background-image: url('artwork/petals/petal-7.png'); }
    .petal:nth-of-type(10n + 8) { background-image: url('artwork/petals/petal-8.png'); }
    .petal:nth-of-type(10n + 9) { background-image: url('artwork/petals/petal-9.png'); }
    .petal:nth-of-type(10n) { background-image: url('artwork/petals/petal-10.png'); }
    @keyframes photogit-fall {
      0% { transform: translate(0, -10vh) rotate(var(--tilt-start, -8deg)); }
      100% { transform: translate(var(--drift, 120px), 120vh) rotate(var(--tilt-end, 8deg)); }
    }
    /* A soft vignette settles the eye on the centred card rather than
       the frame edges. */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(3, 10, 24, 0.5) 100%);
      pointer-events: none;
    }
    .glare {
      position: absolute;
      top: -10%; right: -8%;
      width: 40vmax; height: 40vmax;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
      animation: photogit-glare-pulse 7s ease-in-out infinite;
    }
    @keyframes photogit-glare-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 0 2px, transparent 2px 4px);
      mix-blend-mode: overlay;
      opacity: 0.4;
      animation: photogit-scan 5s linear infinite;
    }
    @keyframes photogit-scan {
      from { background-position: 0 0; }
      to { background-position: 0 8px; }
    }
    /* Explicit stacking, so a future addition to any one layer cannot
       accidentally end up drawn over the card or its click target. */
    .hero { z-index: 0; }
    .vignette { z-index: 1; }
    .fx { z-index: 2; }
    .landing { position: relative; min-height: 100svh; display: grid; place-items: center; isolation: isolate; overflow: hidden; }
    .content { position: relative; z-index: 3; padding: 80px max(20px, env(safe-area-inset-right)) 80px max(20px, env(safe-area-inset-left)); text-align: center; }
    .title-heading { margin: 0; font: inherit; }
    .title {
      display: inline-block; padding: 0; border: 0; background: transparent;
      user-select: none; -webkit-user-select: none;
      cursor: pointer;
      margin: 0 0 20px; font-family: var(--font-logo); font-size: clamp(30px, 5.2vw, 108px); line-height: 1.25;
      letter-spacing: .02em; font-weight: 400; color: #fff; text-transform: uppercase;
      text-shadow: 0 3px 0 #fff, 4px 4px 0 #bdefff, -4px 4px 0 #bdefff, 0 8px 0 #5fc7ff, 0 12px 0 #2d74af, 8px 8px 0 #7bd7ff, -8px 8px 0 #7bd7ff, 0 0 28px #d9f7ff, 0 0 64px #7bd7ff, 0 0 90px #349fff;
      white-space: nowrap;
      transition: text-shadow 220ms ease;
    }
    .title:hover, .title:focus-visible { text-shadow: 0 3px 0 #fff, 4px 4px 0 #bdefff, -4px 4px 0 #bdefff, 0 8px 0 #5fc7ff, 0 12px 0 #2d74af, 8px 8px 0 #7bd7ff, -8px 8px 0 #7bd7ff, 0 0 20px #dbf8ff, 0 0 38px #65c8ff, 0 0 90px #349fff; }
    .title:focus-visible { outline: 3px solid #fff; outline-offset: 10px; }
    /* Temporary typing slots reserve the complete title width. */
    .title-letter { display: inline-block; }
    .actions { display: flex; align-items: stretch; justify-content: center; animation: arrive 550ms 651ms ease-out both; }
    .try-container {
      display: flex; align-items: center; width: min(clamp(280px, 18vw, 360px), calc(100vw - 48px));
      border: 2px solid #ffffffd9; border-radius: 999px;
      background: linear-gradient(145deg, #ffffff65, #c1eaff6b 65%, #78c5f180);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 3px 0 #ffffffa0, inset 0 -4px 0 #71bce966, 0 8px 0 #286b9770, 0 17px 26px #0c385b55;
    }
    .actions a { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; min-height: clamp(60px, 3.5vw, 72px); padding: 11px 40px 13px; border-radius: 999px; color: #fff; text-decoration: none; font-family: Arial, Helvetica, sans-serif; font-size: clamp(19px, 1.1vw, 24px); font-weight: 700; text-shadow: 0 3px 0 #498caf; transition: background 180ms, transform 180ms; }
    .actions a:hover { background: #ffffff38; transform: translateY(-3px); }
    .actions a:focus-visible { outline: 3px solid #ffcbdf; outline-offset: 3px; }
    .actions a .try-arrow { position: absolute; right: 22px; top: calc(50% - 14px); font-size: 26px; line-height: 1; transition: transform 180ms; }
    .actions a:hover .try-arrow { transform: translate(3px, -2px); }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .site-footer {
      position: relative;
      z-index: 4;
      min-height: 64px;
      padding: 8px max(24px, calc((100vw - 1560px) / 2)) max(8px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 4px solid #6ca9d3;
      background: repeating-linear-gradient(90deg, #123451 0 12px, #153956 12px 24px);
      box-shadow: inset 0 4px 0 #9bcff54d;
    }
    .footer-credit { color: #fff0f7; font-size: 12px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .icon-bar { display: flex; align-items: center; gap: 8px; }
    .icon-bar a {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #b6dff5;
      border-radius: 3px;
      background: #112d49;
      color: #fff;
      text-decoration: none;
      box-shadow: inset 0 2px 0 #ffffff30, 3px 3px 0 #09223a;
      transition: transform 180ms, border-color 180ms;
    }
    .icon-bar svg { display: block; width: 23px; height: 23px; fill: currentColor; }
    .icon-bar a:first-child svg { width: 25px; height: 25px; }
    .icon-bar a:nth-child(2) svg { width: 24px; height: 24px; padding: 2px; border-radius: 2px; background: #f4faff; }
    .icon-bar a:nth-child(2) { background: #112d49; color: #123451; border-color: #82c0e9; }
    .icon-bar a:hover { transform: translateY(-3px); border-color: #ffd8ec; }
    .icon-bar a:focus-visible { outline: 3px solid #ffcbdf; outline-offset: 3px; }
    @media (max-width: 560px) {
      .actions { flex-direction: column; align-items: center; gap: 14px; }
      .title { margin-bottom: 14px; }
      .try-container { width: min(280px, calc(100vw - 48px)); justify-content: center; }
      .actions a { min-height: 60px; font-size: 19px; }
      .actions a .try-arrow { right: 20px; }
      .site-footer { padding-inline: 16px; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .footer-credit { font-size: 10px; }
      .icon-bar { gap: 7px; }
      .icon-bar a { width: 44px; height: 44px; }
      .icon-bar svg { width: 20px; height: 20px; }
    }
    @media (max-height: 420px) { .content { padding: 20px; } .title { margin-bottom: 18px; font-size: clamp(24px, 5.2vw, 40px); } .actions { flex-direction: row; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .title-letter { opacity: 1; }
      .sky-cloud:nth-child(1) { left: 8%; }
      .sky-cloud:nth-child(2) { left: 62%; }
      .sky-cloud:nth-child(3) { left: 38%; }
      .sky-cloud:nth-child(4) { left: 74%; }
      .petal { top: calc(var(--size) * 5); }
    }
  </style>

  <script>
    (function () {
      var reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      var title = document.querySelector('.title');
      title.disabled = false;
      var letters = Array.from(title.querySelectorAll('.title-letter'));


      var revealTimers = [];
      var fullTitle = title.textContent;

      function finishReveal() {
        revealTimers.forEach(clearTimeout);
        revealTimers = [];
        // Render one ordinary text node permanently; no animated letter layers remain.
        title.textContent = fullTitle;
      }
      if (reducedMotion.matches) {
        finishReveal();
      } else {
        letters.forEach(function (letter, index) {
          letter.style.visibility = 'hidden';
          revealTimers.push(setTimeout(function () {
            letter.style.visibility = 'visible';
            if (index === letters.length - 1) finishReveal();
          }, 150 + index * 150));
        });
      }
      reducedMotion.addEventListener('change', function (event) {
        if (event.matches) finishReveal();
      });

      var petals = Array.from(document.querySelectorAll('.petal'));
      var phases = petals.map(function (_, index) { return (index + Math.random()) / petals.length; });
      for (var i = phases.length - 1; i > 0; i--) {
        var swapIndex = Math.floor(Math.random() * (i + 1));
        var phase = phases[i];
        phases[i] = phases[swapIndex];
        phases[swapIndex] = phase;
      }
      petals.forEach(function (petal, index) {
        var duration = 16 + Math.random() * 18;
        petal.style.setProperty('--duration', duration.toFixed(2) + 's');
        petal.style.setProperty('--delay', (-phases[index] * duration).toFixed(2) + 's');
        var drift = 80 + Math.random() * 160;
        drift *= Math.random() < 0.5 ? -1 : 1;
        petal.style.setProperty('--drift', Math.round(drift) + 'px');
        var tilt = Math.round(Math.random() * 36 - 18);
        petal.style.setProperty('--tilt-start', tilt + 'deg');
        petal.style.setProperty('--tilt-end', (tilt + Math.round(Math.random() * 24 - 12)) + 'deg');
        petal.style.left = (((index + Math.random()) / petals.length) * 100).toFixed(2) + '%';
      });

      // Small white pixel birds drift through the open sky behind the title.
      var sky = document.querySelector('.fx');
      for (var birdIndex = 0; birdIndex < 7; birdIndex++) {
        var bird = document.createElement('div');
        bird.className = 'bird';
        bird.setAttribute('aria-hidden', 'true');
        bird.style.cssText = '--altitude:' + (9 + birdIndex % 4 * 6) + '%;--bird-size:' + (32 + birdIndex % 3 * 9) + 'px;--wing-speed:' + (650 + birdIndex * 65) + 'ms;--flight:' + (38 + birdIndex * 4) + 's;--phase:-' + (birdIndex * 7 + 5) + 's;--rest:' + (10 + birdIndex * 12) + '%';
        bird.innerHTML = '<svg viewBox="0 0 24 16"><path fill="#d1efff" d="M10 8h6v3h-6z"/><path class="wing" fill="#fffdf4" d="M2 2h4v2h3v2h3v3h-3V7H6V5H2z M12 9V6h3V4h3V2h4v3h-4v2h-3v2z"/><path fill="white" d="M10 8h5v2h-5z"/></svg>';
        sky.appendChild(bird);
      }

      var canvas = document.createElement('canvas');
      canvas.className = 'leaf-swarm';
      canvas.setAttribute('aria-hidden', 'true');
      document.body.appendChild(canvas);
      var paint = canvas.getContext('2d');
      var sprites = Array.from({ length: 10 }, function (_, index) {
        var sprite = new Image();
        sprite.src = 'artwork/petals/petal-' + (index + 1) + '.png';
        return sprite;
      });
      var swarm = [];
      var frame = 0;
      var swarmStart = 0;
      var swarmDuration = 0;
      var lastBurst = -Infinity;
      var viewWidth, viewHeight;
      function sizeCanvas() {
        if (!paint) return;
        viewWidth = window.innerWidth;
        viewHeight = window.innerHeight;
        var scale = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(8000000 / Math.max(1, viewWidth * viewHeight)));
        var width = Math.round(viewWidth * scale);
        var height = Math.round(viewHeight * scale);
        if (canvas.width === width && canvas.height === height) return;
        canvas.width = width;
        canvas.height = height;
        paint.setTransform(scale, 0, 0, scale, 0, 0);
        paint.imageSmoothingEnabled = false;
      }
      sizeCanvas();
      var resizeFrame = 0;
      window.addEventListener('resize', function () {
        if (resizeFrame) return;
        resizeFrame = requestAnimationFrame(function () { resizeFrame = 0; sizeCanvas(); });
      });
      function drawSwarm(now) {
        if (!paint) return;
        var elapsed = (now - swarmStart) / 1000;
        if (paint) paint.clearRect(0, 0, viewWidth, viewHeight);
        swarm.forEach(function (leaf) {
          var age = elapsed - leaf.delay;
          if (age < 0 || age > leaf.life) return;
          var progress = age / leaf.life;
          var x = -50 + progress * (viewWidth + 100);
          var y = leaf.y * viewHeight + Math.sin(age * .8 + leaf.phase) * leaf.wave;
          if (x < -leaf.size || x > viewWidth + leaf.size || y < -leaf.size || y > viewHeight + leaf.size) return;
          // Fade only near the right edge so the entire crossing stays visible.
          var fade = Math.max(0, Math.min(1, (progress - .85) / .15));
          var opacity = 1 - fade * fade * (3 - 2 * fade);
          var alpha = Math.min(1, age / .35) * opacity * .85;
          if (alpha < .005) return;
          paint.save();
          paint.translate(x, y);
          paint.rotate(leaf.phase + age * leaf.spin);
          paint.globalAlpha = alpha;
          var sprite = sprites[leaf.sprite];
          if (sprite.complete && sprite.naturalWidth) {
            paint.drawImage(sprite, -leaf.size / 2, -leaf.size / 2, leaf.size, leaf.size);
          } else {
            paint.fillStyle = "#f8b4d2";
            paint.fillRect(-leaf.size / 4, -leaf.size / 4, leaf.size / 2, leaf.size / 2);
          }
          paint.restore();
        });
        if (elapsed < swarmDuration) frame = requestAnimationFrame(drawSwarm);
        else { swarm = []; frame = 0; if (paint) paint.clearRect(0, 0, viewWidth, viewHeight); }
      }
      function releaseLeaves() {
        var now = performance.now();
        if (frame || now - lastBurst < 700) return;
        lastBurst = now;
        if (reducedMotion.matches || !paint || document.hidden) return;
        cancelAnimationFrame(frame);
        var particleCount = window.innerWidth < 600 ? 600 : 1100;
        if (navigator.connection && navigator.connection.saveData) particleCount = Math.min(particleCount, 400);
        swarm = Array.from({ length: particleCount }, function (_, index) {
          return { y: .08 + Math.random() * .84, delay: index / particleCount * .65,
            life: 7, phase: Math.random() * Math.PI * 2, wave: 4 + Math.random() * 8,
            spin: (Math.random() - .5) * .4, size: 6 + Math.random() * 8, sprite: index % 10 };
        });
        swarmDuration = swarm.reduce(function (end, leaf) { return Math.max(end, leaf.delay + leaf.life); }, 0);
        swarmStart = now;
        frame = requestAnimationFrame(drawSwarm);
      }
      reducedMotion.addEventListener('change', function (event) {
        if (event.matches) stopEffects();
      });
      function stopEffects() {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = 0;
        cancelAnimationFrame(frame);
        frame = 0; swarm = [];
        swarmStart = 0; swarmDuration = 0;
        if (paint) paint.clearRect(0, 0, viewWidth, viewHeight);
      }
      window.addEventListener('pagehide', stopEffects);
      document.addEventListener('visibilitychange', function () {
        document.documentElement.classList.toggle('page-hidden', document.hidden);
        if (document.hidden) stopEffects();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') stopEffects();
      });
      title.addEventListener('click', releaseLeaves);
      title.addEventListener('keydown', function (event) {
        if (event.repeat && (event.key === 'Enter' || event.key === ' ')) event.preventDefault();
      });


    })();
  </script>
