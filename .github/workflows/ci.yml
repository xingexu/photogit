name: CI

on:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git lfs version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run verify:security
      - run: npm run verify:tokens
      - run: npm run verify:panel-dom
      - run: npm run verify:panel-escaping
      - run: npm run verify:assets
      - run: npm run package:development
      - run: npm run verify:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: photogit-development-panel
          path: release/photogit-*-development.zip
          if-no-files-found: error

  suites:
    name: Suite · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - panel-depth
          - panel-counter
          - panel-reveal
          - panel-motion
          - panel-contract
          - panel-escaping
          - panel-escaping-gate
          - panel-branches
          - panel-versions
          - panel-reviews
          - panel-workspace
          - panel-manifest
          - helper
          - engine
          - protocol
          - differ
          - merge
          - serializer
          - schema
          - cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:${{ matrix.suite }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
